# Gremlyn configuration example.
#
# Copy to gremlyn.yaml and edit. This file never contains secret values:
# secrets are read from the environment variables named by `token_env` fields.

# Directory holding the SQLite database, captured output, and per-attempt
# agent state. Created on first start.
data_dir: .gremlyn

# debug | info | warn | error
log_level: info

# How often each enabled repository is polled for new review comments.
poll_interval_seconds: 60

# Maximum number of agent attempts running simultaneously.
concurrency: 2

github:
  # Name of the environment variable holding the GitHub token.
  # The token value itself NEVER appears in this file.
  token_env: GREMLYN_GITHUB_TOKEN
  # Login of the dedicated GitHub identity the orchestrator acts as.
  # Must be distinct from every entry in allowed_authors.
  orchestrator_login: gremlyn-bot

# Commit attribution is independent of the bot account that authenticates,
# comments, and pushes. Use an email verified on the desired GitHub author account.
git:
  author_name: Your Name
  author_email: your-github-verified-email@example.com

console:
  # Loopback by default. Binding anything else exposes a control surface;
  # the token is still required either way.
  host: 127.0.0.1
  port: 4780
  # Name of the environment variable holding the console auth token.
  token_env: GREMLYN_CONSOLE_TOKEN

agent_defaults:
  # Initial per-repository timeout in seconds. 0 means no limit; the live
  # value can be changed from the repository card in the console.
  timeout_seconds: 0
  # Bounded consecutive-mistake allowance passed to the agent.
  retries: 2

# GitHub logins permitted to issue commands. Case-insensitive. The
# orchestrator_login must NOT appear here.
allowed_authors:
  - your-github-login

# Agents available for repositories to reference. `efforts` lists the
# supported reasoning-effort tiers from lowest to highest; the last entry is
# the ceiling and the default for repositories that do not specify one.
#
# Bound this list by the MODELS this deployment runs, not by the CLI. The
# ceiling is per-model: deepseek-v4-flash accepts only high|xhigh, while
# gpt-5.6-luna also accepts max. Listing a tier the model does not accept
# makes it the silent default and the CLI will not reject it — the
# orchestrator logs a warning when the model's advertised set disagrees.
# Known tiers: none, low, medium, high, xhigh, max.
# `credential_source` is the read-only directory holding the operator's
# authenticated cline installation (where `cline auth` stored credentials).
# It is scoped per-agent, verified at startup, and never written to.
agents:
  cline:
    binary: cline
    efforts: [none, low, medium, high, xhigh]
    credential_source: C:/Users/you/.cline/data

repositories:
  - owner: your-github-login
    name: your-repo
    # Local source repository. Never mutated: fetch plus isolated checkout
    # setup only.
    source_path: D:/code/your-repo
    # Root under which per-PR disposable isolated checkouts are created.
    # Must not be inside the source repository.
    workspace_root: D:/code/gremlyn-workspaces/your-repo
    agent: cline
    provider: your-provider
    model: your-provider/lune-5.6
    # Optional; defaults to the agent's highest supported tier.
    effort: xhigh
    enabled: true
    # Validation run in the workspace after the agent exits, in order, each as
    # an argument vector (no shell). Empty list means inspection only.
    validation_commands:
      - [npm, run, build]
      - [npm, test]
    # Repository-relative gitignored files copied from source_path into every
    # prepared workspace. Git checkouts carry tracked content only, so a
    # build input git deliberately ignores (local.properties, .env) is missing
    # from every fresh workspace and validation fails on the environment rather
    # than on the agent's work. Each entry must be gitignored: publication
    # commits with `git add -A`, so a tracked path would be pushed to the PR.
    workspace_seed_files: []
    # Optional repository-specific instructions appended to every prompt.
    agent_instructions: |
      Follow the existing code conventions in this repository.
